org: jdmg1
app: jwtanalyzer
service: jwt-analyzer

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1

  httpApi:
    cors:
      allowedOrigins:
        - 'http://127.0.0.1:5500'
        - 'http://localhost:5173'
      allowedMethods:
        - GET
        - POST
        - OPTIONS
      allowedHeaders:
        - Content-Type
      allowCredentials: false

functions:
  api:
    handler: handler.handler
    events:
      - httpApi: '*'
